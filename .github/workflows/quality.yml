name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-and-infrastructure:
    name: Backend and SAM validation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.11.26
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
      - name: Verify Python lock is current
        run: >-
          uv pip compile requirements.in --python-version 3.12
          --python-platform x86_64-unknown-linux-gnu --generate-hashes
          --output-file requirements.txt --no-cache --no-python-downloads
      - name: Reject a stale Python lock
        run: git diff --exit-code -- backend/requirements.txt
        working-directory: .
      - name: Install backend and test dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Check backend Python syntax
        run: python -m compileall -q app scripts
      - name: Run backend behavioral tests
        run: python -m pytest -q
      - name: Validate SAM template
        working-directory: .
        run: sam validate --template-file template.yaml --lint
